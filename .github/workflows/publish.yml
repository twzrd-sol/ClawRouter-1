name: Publish (npm)

# Release is manual so merging code cannot publish packages without an operator
# dispatch. Run this workflow against claude/twzrd-fork, the fork's release target.

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish the exact core and MPP versions shown in the run log
        required: true
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/claude/twzrd-fork' && inputs.confirm_publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # required for npm --provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      - name: Resolve Twzrd package versions
        id: versions
        shell: bash
        run: |
          ROOT_NAME=$(node -p "require('./package.json').name")
          ROOT_VERSION=$(node -p "require('./package.json').version")
          ROOT_NPM_VERSION=$(npm view "$ROOT_NAME" version 2>/dev/null || echo "none")
          MPP_NAME=$(node -p "require('./packages/clawrouter-mpp/package.json').name")
          MPP_VERSION=$(node -p "require('./packages/clawrouter-mpp/package.json').version")
          MPP_NPM_VERSION=$(npm view "$MPP_NAME" version 2>/dev/null || echo "none")

          {
            echo "root_name=$ROOT_NAME"
            echo "root_version=$ROOT_VERSION"
            echo "root_npm_version=$ROOT_NPM_VERSION"
            echo "publish_root=$([ "$ROOT_VERSION" != "$ROOT_NPM_VERSION" ] && echo true || echo false)"
            echo "mpp_name=$MPP_NAME"
            echo "mpp_version=$MPP_VERSION"
            echo "mpp_npm_version=$MPP_NPM_VERSION"
            echo "publish_mpp=$([ "$MPP_VERSION" != "$MPP_NPM_VERSION" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "$ROOT_NAME: package=$ROOT_VERSION registry=$ROOT_NPM_VERSION"
          echo "$MPP_NAME: package=$MPP_VERSION registry=$MPP_NPM_VERSION"

      - name: Install core dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build, typecheck, and test core
        run: |
          npx prettier --check .
          npm run lint
          npm run build
          npm run typecheck
          npm test
          node scripts/sync-brand-numbers.mjs --check

      - name: Install MPP package development dependencies
        working-directory: packages/clawrouter-mpp
        run: npm install --ignore-scripts --legacy-peer-deps --package-lock=false --no-audit --no-fund

      - name: Build, typecheck, and test MPP package
        working-directory: packages/clawrouter-mpp
        run: |
          npm run build
          npm run typecheck
          npm test

      # The root package must publish first because MPP declares it as a peer.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish core package
        if: steps.versions.outputs.publish_root == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip core package (already published)
        if: steps.versions.outputs.publish_root != 'true'
        run: echo "${{ steps.versions.outputs.root_name }}@${{ steps.versions.outputs.root_version }} is already published"

      - name: Publish MPP package
        if: steps.versions.outputs.publish_mpp == 'true'
        working-directory: packages/clawrouter-mpp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip MPP package (already published)
        if: steps.versions.outputs.publish_mpp != 'true'
        run: echo "${{ steps.versions.outputs.mpp_name }}@${{ steps.versions.outputs.mpp_version }} is already published"
